AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AlphaForge AI - construction de l'image : dépôt Amazon ECR et projet AWS CodeBuild qui construit l'image Docker
  de l'interface à partir d'une archive du code déposée dans S3 (pas de Docker requis sur le poste).
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  ArtifactBucket:
    Type: String
    Description: Bucket S3 existant (privé, chiffré) où l'archive du code est déposée sous build/.
  SourceKey:
    Type: String
    Default: build/source.zip

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Metadata:
      com.aws.cloudformation.Context:
        why: Héberge l'image de l'interface ; balises immuables pour qu'un déploiement désigne toujours la même image.
        must: Garder ImageTagMutability IMMUTABLE et le scan à l'envoi.
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"garder les 5 dernières images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}

  BuildLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/${AWS::StackName}
      RetentionInDays: 14

  BuildRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Droits minimaux de CodeBuild - lire l'archive du code, écrire ses journaux, pousser dans ce seul dépôt ECR.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${BuildLogs.Arn}:*
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/build/*
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource: !GetAtt Repository.Arn

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 20
      Artifacts: { Type: NO_ARTIFACTS }
      Source:
        Type: S3
        Location: !Sub ${ArtifactBucket}/${SourceKey}
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${REPO_URI%%/*}"
            build:
              commands:
                - docker build -t "$REPO_URI:$IMAGE_TAG" .
            post_build:
              commands:
                - docker push "$REPO_URI:$IMAGE_TAG"
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: REPO_URI, Value: !GetAtt Repository.RepositoryUri }
          - { Name: IMAGE_TAG, Value: replace-at-start-build }
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogs

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  BuildProjectName:
    Value: !Ref BuildProject
