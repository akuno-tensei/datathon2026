AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AlphaForge AI - hébergement de l'interface Streamlit : Amazon CloudFront (HTTPS) -> Application Load Balancer
  (joignable seulement depuis CloudFront, avec en-tête d'origine) -> une tâche Amazon ECS Fargate. La tâche appelle
  Amazon Bedrock (interprétation des demandes) et archive chaque registre de preuves dans Amazon S3. Simulation uniquement.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  ImageUri:
    Type: String
    Description: Image construite par la pile de construction (dépôt ECR et balise).
  ArtifactBucket:
    Type: String
    Description: Bucket S3 existant des archives (runs/).
  ModelId:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
  FoundationModel:
    Type: String
    Default: anthropic.claude-haiku-4-5-20251001-v1:0
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Au moins deux sous-réseaux publics de zones différentes.
  CloudFrontPrefixList:
    Type: String
    Default: pl-3b927c52
    Description: Liste de préfixes gérée com.amazonaws.global.cloudfront.origin-facing (us-east-1).

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: L'équilibreur n'est joignable que par les serveurs d'origine de CloudFront.
        must: Ne jamais ouvrir à 0.0.0.0/0.
    Properties:
      GroupDescription: AlphaForge ALB - ingress from CloudFront origin-facing only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixList

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AlphaForge task - ingress from the ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "3600" }  # connexion WebSocket de Streamlit
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8501
      HealthCheckPath: /_stcore/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "10" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Sans en-tête d'origine, réponse 403 : même depuis un autre CloudFront, l'équilibreur ne sert que notre distribution.
          HTTP entre CloudFront et l'ALB (pas de domaine ni de certificat) ; le visiteur est toujours en HTTPS.
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: { StatusCode: "403", ContentType: text/plain, MessageBody: Forbidden }

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values: [!Select [2, !Split ["/", !Ref AWS::StackId]]]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }

  AppLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 14

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Seuls droits de l'application - appeler un seul modèle Bedrock (profil d'inférence global et modèle sous-jacent)
          et écrire des archives sous runs/. Aucune lecture S3, aucun autre service.
        must: Pas d'action ni de ressource génériques.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BedrockOneModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${FoundationModel}
                  - !Sub arn:${AWS::Partition}:bedrock:::foundation-model/${FoundationModel}
              - Sid: ArchiveRunsOnly
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/runs/*

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "2048"
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 8501, Protocol: tcp }]
          Environment:
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: ALPHAFORGE_LLM_MODEL, Value: !Ref ModelId }
            - { Name: ALPHAFORGE_S3_BUCKET, Value: !Ref ArtifactBucket }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED  # sous-réseaux publics sans passerelle NAT : accès sortant à ECR, Bedrock et S3
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8501
          TargetGroupArn: !Ref TargetGroup

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          HTTPS pour le visiteur sans domaine propre. Aucun cache (interface dynamique) et tous les en-têtes transmis,
          dont Host et Origin, nécessaires à la vérification d'origine du WebSocket de Streamlit.
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: AlphaForge AI (simulation)
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Select [2, !Split ["/", !Ref AWS::StackId]]
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # Managed-AllViewer

Outputs:
  AppUrl:
    Description: Adresse publique de l'interface (HTTPS).
    Value: !Sub https://${Distribution.DomainName}/
  LogGroup:
    Value: !Ref AppLogs
